server:
  port: 8080

spring:
  application:
    name: zariyo-backend

  # Database Setup (MySQL)
  datasource:
    url: jdbc:mysql://localhost:3306/zariyo_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: zariyo
    password: zariyo_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis Settings (Temporary session locks and broadcasts)
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.web: info

# JWT Token Settings
jwt:
  secret: z2FyaXlvLXNlY3JldC1rZXktZm9yLWF1dGhlbnRpY2F0aW9uLWFuZC1hdXRob3JpemF0aW9uLXNlY3VyZS1rZXktMjAyNg==
  access-token-expiration: 86400000 # 24시간 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)


services:
  # MySQL 컨테이너 (데이터베이스)
  mysql:
    image: mysql:8.0
    container_name: zariyo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zariyo_db
      MYSQL_USER: zariyo
      MYSQL_PASSWORD: zariyo_password
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: always

  # Redis 컨테이너 (동시성 제어 락, 실시간 데이터 캐싱)
  redis:
    image: redis:7.2-alpine
    container_name: zariyo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: always

volumes:
  mysql-data:
  redis-data:
